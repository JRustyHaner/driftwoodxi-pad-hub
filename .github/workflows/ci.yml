name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks
          sudo luarocks install luacheck
          sudo luarocks install busted

      - name: Luacheck
        run: luacheck addons/dwhub spec

      - name: Busted
        run: busted -o utfTerminal spec
